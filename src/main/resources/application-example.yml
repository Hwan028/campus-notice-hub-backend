# 복사해서 src/main/resources/application.yml 로 쓴다. (application.yml 은 비밀번호가 들어가므로 git에 올리지 않는다)
# cp src/main/resources/application-example.yml src/main/resources/application.yml
spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/campus_notice_hub?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Seoul
    username: cnh_app
    password: ${DB_PASSWORD:change-me}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update          # 운영에서는 validate + 마이그레이션 도구(Flyway 등) 권장
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always      # 운영에서는 when-authorized 로 바꾸거나 관리 포트를 분리할 것

crawler:
  admin-token: ${CRAWLER_ADMIN_TOKEN:}   # 비어 있으면 관리자 API는 전부 403 (안전한 기본값)
  scheduler:
    enabled: true
    interval-ms: 3600000
    initial-delay-ms: 5000
  fetch:
    user-agent: "CampusNoticeHub/0.1 (학내 공지 모아보기 학생 프로젝트)"
    timeout-ms: 5000
  health:
    baseline-window: 24
    min-baseline-samples: 12
    min-rows-for-rate: 5
    rate-drop-factor: 0.5
    size-drop-factor: 0.5
    transient-failure-threshold: 2
    reminder-every-cycles: 24
    stale-after-minutes: 180
  alert:
    discord-webhook-url: ${DISCORD_WEBHOOK_URL:}
